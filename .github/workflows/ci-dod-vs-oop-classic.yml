name: CI — dod-vs-oop-classic

on:
  push:
    branches: [main, dev, 'feat/**', 'chore/**', 'docs/**']
    paths:
      - 'dod-vs-oop-classic/**'
      - 'scripts/**'
      - '.github/workflows/ci-dod-vs-oop-classic.yml'
  pull_request:
    branches: [main, dev, 'feat/**']
    paths:
      - 'dod-vs-oop-classic/**'
      - 'scripts/**'
      - '.github/workflows/ci-dod-vs-oop-classic.yml'

permissions:
  contents: read

concurrency:
  group: ci-classic-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dod-vs-oop-classic

jobs:
  lint-typecheck-test:
    name: Lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ strips TS types natively (used by the smoke harness).
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: dod-vs-oop-classic/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + format check)
        run: pnpm lint

      - name: TypeScript (typecheck)
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

  smoke:
    name: Smoke (SRS conformance harness)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-typecheck-test
    env:
      # Backend port convention: 3333 (3000 reserved for frontend).
      PORT: 3333
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ strips TS types natively (used by the smoke harness).
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: dod-vs-oop-classic/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Boot in background; stderr stays on the CI log so a boot failure
      # is loud. No wrapper script — boot + smoke + teardown are explicit
      # steps so each failure mode points at exactly one thing.
      - name: Start server
        run: node dist/main.js &
        # Background job; the next step polls until the port answers.

      - name: Wait for port
        run: |
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}" -o /dev/null; then
              echo "server is up on :${PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not respond on :${PORT} within 30s" >&2
          exit 1

      - name: Smoke harness
        run: pnpm smoke

      - name: Stop server
        if: always()
        run: |
          # The background server is a child of the runner shell; kill any
          # listener on the PORT to be sure.
          fuser -k "${PORT}/tcp" 2>/dev/null || true
